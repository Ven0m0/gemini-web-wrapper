[project]
name = "affine-code-index"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "ast-grep-py>=0.42.1",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "affine-config",
    "affine-llm-core",
]

[project.optional-dependencies]
# All imported lazily at runtime. Optional because lancedb + pyarrow + numpy are ~400 MB, which
# pushes the Vercel function over its 500 MB limit; chat does not need them.
local-index = [
    "lancedb>=0.21.0",
    "numpy>=1.24.0",
    "pyarrow>=25.0.1",
    "voyageai>=0.3.7",
]
local-embeddings = [
    "sentence-transformers>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
affine-config = { workspace = true }
affine-llm-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "affine.code_index"
