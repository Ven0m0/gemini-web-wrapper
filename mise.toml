[settings]
experimental = true
color = true
yes = true
auto_install = true

[settings.python]
uv_venv_auto = "create|source"
uv_venv_create_args = ["--seed", "--system-site-packages"]

[settings.pipx]
uvx = true

[tools]
node = "26"
bun = "latest"
python = "3.14"
uv = "latest"
ruff = "latest"
ty = "latest"
prek = "latest"
"pipx:pytest" = "latest"
"pipx:basedpyright" = "latest"
ripgrep = "latest"
fd = "latest"

[env]
PROJECT_ROOT = "{{config_root}}"
UV_LINK_MODE = "symlink"
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed", "--system-site-packages"] }

[hooks]
enter = "mise i -yq"

[tasks.install]
description = 'Mise ci install'
shell = "bash -c"
run = '''
export DEBIAN_FRONTEND=noninteractive DEBCONF_NOWARNINGS=yes

bun install --frozen-lockfile || true
uv sync --all-extras --all-packages --all-groups --link-mode symlink --locked || true
cd apps/web && bun install --frozen-lockfile || true
cd ../api && uv sync --all-extras --all-packages --all-groups --link-mode symlink --locked || true
cd ../..
[[ -f .venv/bin/activate ]] && source .venv/bin/activate
'''

[tasks.test]
description = "Run tests"
run = "pytest tests/"

[tasks.lint]
description = "Lint the code"
run = "ruff apps/ packages/"
