[project]
name = "affine-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "ast-grep-py>=0.42.1",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx[http2]>=0.28.1",
    "libsql>=0.1.11",
    "orjson>=3.9.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "affine-shared",
    "affine-llm-core",
    "affine-config",
    "affine-code-index"
]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.2",
]

[tool.uv.sources]
affine-shared = { workspace = true }
affine-llm-core = { workspace = true }
affine-config = { workspace = true }
affine-code-index = { workspace = true }

[tool.ruff.lint]
# Handlers catch ValueError for malformed upstream payloads, so TypeError is the wrong contract.
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["affine"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
